server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The host Nginx normally forwards Accept-Encoding, so this layer compresses
  # static assets once. If an upstream response is already encoded, Nginx does
  # not apply the gzip filter a second time.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/x-yaml
    application/yaml
    image/svg+xml
    text/css
    text/javascript
    text/yaml;

  # Vite emits content-hashed files below /assets/. The URL changes whenever
  # the bytes change, so browsers and CDNs can retain them indefinitely.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app shell selects the current hashed assets and must always revalidate.
  # SPA fallbacks below internally redirect here and inherit this policy.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
